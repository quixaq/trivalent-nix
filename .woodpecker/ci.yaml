when:
  - event: cron
    cron: "19 7 * * *"
  - event: manual

steps:
  - name: check-and-update-trivalent
    image: fedora:44@sha256:f717d3f59ea0dc45d3c024c9477e786bab7d418d26636920d17b48016f1e69ca
    commands:
      - CURRENT_X86_64=$(grep 'target-x86_64-dl' flake.nix | sed -E 's/.*"([^"]+)".*/\1/')
      - CURRENT_AARCH64=$(grep 'target-aarch64-dl' flake.nix | sed -E 's/.*"([^"]+)".*/\1/')

      - REPO_RAW=$(dnf repoquery --repofrompath=temp,https://repo.secureblue.dev/ --repoid=temp --queryformat="https://repo.secureblue.dev/Packages/%{name}-%{version}-%{release}.%{arch}.rpm\n")

      - |
        : "${LATEST_X86_64:=$(echo "$REPO_RAW" | grep '^https://repo.secureblue.dev/Packages/trivalent-[0-9].*x86_64\.rpm$' | sort -V | tail -n 1)}"
        echo "$LATEST_X86_64"
      - |
        : "${LATEST_AARCH64:=$(echo "$REPO_RAW" | grep '^https://repo.secureblue.dev/Packages/trivalent-[0-9].*aarch64\.rpm$' | sort -V | tail -n 1)}"
        echo "$LATEST_AARCH64"

      - |
        if [[ "$LATEST_X86_64" == "$CURRENT_X86_64" && "$LATEST_AARCH64" == "$CURRENT_AARCH64" ]]; then
          echo "No updates found. Exiting."
          exit 0
        fi

      - dnf install -y nix jq golang git rpm gh
      - go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1

      - mkdir temp_workspace
      - cd temp_workspace
      - mkdir x86_64 && mkdir aarch64
      - gh release download "$X86_64_VERSION" --repo secureblue/Trivalent --pattern multiple.intoto.jsonl --dir ./x86_64
      - gh release download "$AARCH64_VERSION" --repo secureblue/Trivalent --pattern multiple.intoto.jsonl --dir ./aarch64
      - cd x86_64 && curl -O "$LATEST_X86_64" || exit 1
      - cd ../aarch64 && curl -O "$LATEST_AARCH64" || exit 1
      - cd .. && curl -O https://repo.secureblue.dev/secureblue.gpg || exit 1

      - |
        X86_64_VERSION=$(echo "$LATEST_X86_64" | sed -E 's/.*trivalent-(.*)\.x86_64\.rpm/\1/')
        echo "$X86_64_VERSION"
      - |
        AARCH64_VERSION=$(echo "$LATEST_AARCH64" | sed -E 's/.*trivalent-(.*)\.aarch64\.rpm/\1/')
        echo "$AARCH64_VERSION"
      - |
        STRIPPED_VERSION=$(echo "$X86_64_VERSION" | sed -E 's/-[^-]+$//')
        echo "$STRIPPED_VERSION"

      - EXPECTED_HASH="40d8ad2714bb09873153668d9c647362acc48677a2c0defb0c7d6576041fd555"
      - echo "$EXPECTED_HASH  secureblue.gpg" | sha256sum --check --strict || exit 1

      - TEMP_DB=$(mktemp -d)
      - rpm --dbpath "$TEMP_DB" --import secureblue.gpg
      - rpm --dbpath "$TEMP_DB" -K x86_64/$(basename "$LATEST_X86_64") || exit 1
      - rpm --dbpath "$TEMP_DB" -K aarch64/$(basename "$LATEST_AARCH64") || exit 1
      - rm -rf "$TEMP_DB"

      - cd x86_64 && slsa-verifier verify-artifact $(basename "$LATEST_X86_64") --provenance-path multiple.intoto.jsonl --source-uri github.com/secureblue/Trivalent || exit 1
      - cd ../aarch64 && slsa-verifier verify-artifact $(basename "$LATEST_AARCH64") --provenance-path multiple.intoto.jsonl --source-uri github.com/secureblue/Trivalent || exit 1
      - cd ..

      - sed -i -E "s|\"[^\"]+\"(.*# target-x86_64-dl)|\"$LATEST_X86_64\"\1|" flake.nix
      - sed -i -E "s|\"[^\"]+\"(.*# target-aarch64-dl)|\"$LATEST_AARCH64\"\1|" flake.nix
      - sed -i -E "s|\"[^\"]+\"(.*# target-ver)|\"$STRIPPED_VERSION\"\1|" flake.nix

      - X86_64_HASH=$(nix hash to-sri --type sha256 $(nix-prefetch-url file:///dev/stdin < temp_workspace/x86_64/$(basename "$LATEST_X86_64")))
      - AARCH64_HASH=$(nix hash to-sri --type sha256 $(nix-prefetch-url file:///dev/stdin < temp_workspace/aarch64/$(basename "$LATEST_AARCH64")))

      - sed -i -E "s|\"[^\"]+\"(.*# target-x86_64-hash)|\"$X86_64_HASH\"\1|" flake.nix
      - sed -i -E "s|\"[^\"]+\"(.*# target-aarch64-hash)|\"$AARCH64_HASH\"\1|" flake.nix

      - nix build .

      - git config --global user.name "woodpecker-ci[bot]"
      - git config --global user.email "woodpecker-ci[bot]@codeberg.org"
      - git add .
      - "git commit -m \"chore: update trivalent\""
      - git push origin HEAD:main
